<body>
<a class="back" href="./">← Back to the game</a>
<h1>Tell us what you think</h1>
<p>Found a bug? Got stuck? Have a funny idea for a new level? We read everything.</p>
<form id="f">
  <label for="kind">What is it about?</label>
  <select id="kind">
    <option value="bug">🐞 Something is broken</option>
    <option value="stuck">🤔 I got stuck / confused</option>
    <option value="idea">💡 Idea for the game</option>
    <option value="love">❤️ I like something</option>
  </select>
  <label for="msg">Tell us more (please don't include your name, phone or email)</label>
  <textarea id="msg" required maxlength="1500"></textarea>
  <button type="submit">Send feedback →</button>
  <p class="note">This opens a pre-filled page on GitHub (a free account is needed to post). Your device type and game version are added automatically so we can fix bugs faster.</p>
</form>
<script>
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var kind = document.getElementById('kind');
    var title = kind.options[kind.selectedIndex].text + ' — player feedback';
    var w = Math.min(screen.width, screen.height);
    var body = document.getElementById('msg').value + '\n\n---\nDevice: ' + (w < 600 ? 'phone' : w < 900 ? 'tablet' : 'desktop') + ' · ' + navigator.userAgent.split(') ')[0] + ')';
    var url = 'https://github.com/sammyjel/compound-wahala/issues/new?labels=' + encodeURIComponent('feedback,' + kind.value) + '&title=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(body);
    window.open(url, '_blank', 'noopener');
  });
</script>
</body>
