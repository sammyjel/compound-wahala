<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6f50" />
    <meta name="description" content="Compound Wahala: Naija Neighbourhood Wars — a comedy simulation about sharing one generator, one water tank and endless opinions." />
    <title>Compound Wahala</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6f50'/%3E%3Cpath d='M6 15l10-8 10 8v11H6z' fill='%23f2b632'/%3E%3Crect x='13' y='18' width='6' height='8' fill='%23c8553d'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <section id="screen-title" class="screen" aria-label="Title screen"></section>

      <section id="screen-game" class="screen" hidden aria-label="Game">
        <header id="hud">
          <div id="hud-main"></div>
          <div id="hud-stats" aria-label="Your stats"></div>
          <button id="btn-menu" class="icon-btn" type="button" aria-label="Pause menu">☰</button>
        </header>
        <main id="stage">
          <div id="scene-wrap">
            <canvas id="scene" aria-label="Unity Compound. Use the residents and places bars below if you cannot use the picture."></canvas>
            <div id="toasts" aria-live="polite"></div>
          </div>
          <aside id="panel" aria-live="polite"></aside>
        </main>
        <nav id="dock" aria-label="Residents, places and menus">
          <div id="dock-residents" class="strip" aria-label="Residents"></div>
          <div id="dock-places" class="strip" aria-label="Places"></div>
          <div id="dock-nav"></div>
        </nav>
      </section>

      <section id="screen-results" class="screen" hidden aria-label="Results"></section>
      <div id="modal-root"></div>
      <noscript>Compound Wahala needs JavaScript to run.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
