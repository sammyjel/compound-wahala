{amaka:-1},flags:["met_amaka"]},reply:[{who:"npc",text:"Thank you for the diagnosis, doctor. Welcome."}]}]},Te("amaka","Ask how she copes",[{who:"npc",text:"I pay my bills the day they arrive. I keep my side clean. I just want everyone else to do the same."},{who:"npc",text:"And quiet. Please. I sleep in the afternoon — knock on my door then and you will meet my village people.",plain:"You will see my angry side."},{who:"narrator",text:"Amaka cares about FAIRNESS and PEACE & QUIET. Never wake her in the afternoon."}]),{id:"chat_amaka",npc:"amaka",label:"Ask for a health tip",kind:"chat",daily:!0,cond:V("amaka"),lines:[{who:"npc",text:"Drink water. Not Coke. Water. And stop eating suya at midnight.",plain:"Avoid late-night spicy meat."}],effects:{trust:{amaka:2},happiness:3}},{id:"amaka_need",npc:"amaka",label:"Ask what would help her",kind:"mission",once:!0,cond:e=>e.missions.m_amaka==="active",lines:[{who:"npc",text:"Honestly? Sleep. Tobi's speaker starts its concert exactly when I lie down."},{who:"npc",text:"If he used headphones at night, or if I had proper earplugs... I would bless your name."}],effects:{flags:["amaka_asked"]}},{id:"amaka_earplugs",npc:"amaka",label:"Give her the earplugs",kind:"mission",once:!0,cond:e=>e.missions.m_amaka==="active"&&f(e,"has_earplugs"),lines:[{who:"npc",text:"Foam earplugs! The good ones! You are a blessing. I am going to sleep like a baby."}],effects:{flags:["amaka_helped"],unflags:["has_earplugs"],trust:{amaka:12},reputation:3}},{id:"amaka_headphones",npc:"amaka",label:"Tell her Tobi will use headphones",kind:"mission",once:!0,cond:e=>e.missions.m_amaka==="active"&&f(e,"tobi_headphones"),lines:[{who:"npc",text:"You talked to Tobi? And he AGREED? You should be in government."}],effects:{flags:["amaka_helped"],trust:{amaka:14},reputation:4}},{id:"intro_femi",npc:"femi",label:"Introduce yourself",kind:"intro",once:!0,lines:[{who:"npc",text:"My person! Welcome! I am Femi — CEO, Femi Global Ventures Limited. Not yet registered, but the vision is registered."}],choices:[{label:'"Nice to meet you, CEO!"',effects:{trust:{femi:6},flags:["met_femi"]},reply:[{who:"npc",text:"See! You recognise greatness. We will do business together."}]},{label:'"CEO of what, exactly?"',effects:{trust:{femi:1},happiness:2,flags:["met_femi"]},reply:[{who:"npc",text:"Of... ventures. Global ones. It is a long story. Welcome!"}]}]},Te("femi","Ask about his business",[{who:"npc",text:"Between us? Things are a bit tight. But you cannot look broke — looking broke is how you stay broke."},{who:"npc",text:"Every naira I spend must be an investment. Levies are not investments. Levies are pain."},{who:"narrator",text:"Femi cares about MONEY and how he LOOKS. A steady job would change everything for him."}]),{id:"chat_femi",npc:"femi",label:"Ask about his latest deal",kind:"chat",daily:!0,cond:V("femi"),lines:e=>{const t=We(Pe(e.seed,e.day,21),Tn);return[{who:"npc",text:t.text,plain:t.plain}]},effects:{trust:{femi:2},happiness:2}},{id:"femi_bill",npc:"femi",label:"Bring up the NEPA bill",kind:"mission",cond:e=>V("femi")(e)&&Pt("femi")(e)&&!f(e,"femi_will_pay_nepa")&&!f(e,"femi_job"),lines:[{who:"npc",text:"NEPA bill? Ah, yes. I am expecting an alert any moment now. Any moment.",plain:"I am waiting for money to arrive."},{who:"narrator",text:"He refreshes his banking app. Nothing."}],choices:[{label:"Pay his ₦2,000 share for him",blocked:e=>e.stats.cash<2e3?"Not enough cash":null,effects:{run:e=>{ye(e,"nepa","femi")}},reply:[{who:"npc",text:"Chairman! I will pay you back with interest when the alert lands. Put it in writing — no, don't."}]},{label:'"Iya Bisi needs a delivery rider. Real money, every day."',cond:e=>f(e,"bisi_needs_rider"),blocked:e=>e.trust.bisi<55?"Iya Bisi must trust you (55+) to vouch for him":null,effects:{flags:["femi_job"],trust:{femi:10,bisi:3},reputation:3,log:"Femi starts as Iya Bisi's delivery rider."},reply:[{who:"npc",text:"A job? A real one? With... salary? ...You know what. Let me try it. CEO and rider. Both can be true."},{who:"narrator",text:"With steady income, Femi will pay his shares on time from now on."}]},{label:`"Pay up, or I'll tell Chief."`,effects:{flags:["femi_will_pay_nepa"],trust:{femi:-8},reputation:1},reply:[{who:"npc",text:"Haba! No need to involve the red cap. Fine, I will pay by the deadline.",plain:"Don't tell the landlord!"}]},{label:'"Okay, never mind."',reply:[{who:"npc",text:"God bless you, my person. The alert is coming."}]}]},{id:"femi_loan",npc:"femi",label:"Femi wants to borrow ₦3,000",kind:"mission",once:!0,cond:e=>V("femi")(e)&&e.day>=3,lines:[{who:"npc",text:"Small favour. Lend me ₦3,000. By Day 6 I will return it, plus extra. Business is business."}],choices:[{label:"Lend him ₦3,000",blocked:e=>e.stats.cash<3e3?"Not enough cash":null,effects:{cash:-3e3,flags:["femi_loan"],trust:{femi:6}},reply:[{who:"npc",text:"You will not regret this! Probably!"}]},{label:`"Sorry, I'm tight this week."`,effects:{trust:{femi:-2}},reply:[{who:"npc",text:"No wahala. Everybody is tight. The economy is tight."}]}]},{id:"intro_bisi",npc:"bisi",label:"Introduce yourself",kind:"intro",once:!0,lines:[{who:"npc",text:"Welcome, new tenant! I am Iya Bisi. Fuel, water, noodles, credit for the honest. Buy something, bless your new house!"}],choices:[{label:'Buy a sachet of water to "bless the house" (₦50)',effects:{cash:-50,happiness:2,trust:{bisi:6},flags:["met_bisi"]},reply:[{who:"npc",text:"First customer energy! This one will prosper."}]},{label:'"Just greeting, Ma."',effects:{trust:{bisi:2},flags:["met_bisi"]},reply:[{who:"npc",text:"Greeting is free. Fuel is not. I will see you soon."}]}]},Te("bisi","Ask how business is",[{who:"npc",text:"My freezer has fish, my customers want cold drinks, and NEPA wants me to suffer. Light is money for me."},{who:"npc",text:"And between us — I need a delivery rider. Somebody honest, with legs and a phone."},{who:"narrator",text:"Iya Bisi cares about BUSINESS and MONEY. She is hiring a delivery rider."}]),{id:"chat_bisi",npc:"bisi",label:"Talk market prices",kind:"chat",daily:!0,cond:V("bisi"),lines:[{who:"npc",text:"Tomatoes are now priced like gold. Soon I will sell one tomato with a receipt and a warranty."}],effects:{trust:{bisi:2},happiness:2}},{id:"intro_tobi",npc:"tobi",label:"Introduce yourself",kind:"intro",once:!0,lines:[{who:"npc",text:"Yo! New neighbour! I'm Tobi — DJ Tee to the streets. You get Instagram? Follow me, I follow back!"}],choices:[{label:'"Followed! Turn on post notifications too."',effects:{trust:{tobi:6},flags:["met_tobi"]},reply:[{who:"npc",text:"Day one supporter! When I blow, you are in the documentary.",plain:"When I become famous..."}]},{label:`"I don't really do social media."`,effects:{trust:{tobi:-1},flags:["met_tobi"]},reply:[{who:"npc",text:"Ah. Old school. Respect, I guess. Like a museum."}]}]},Te("tobi","Ask about his dreams",[{who:"npc",text:"Big stage. Big crowd. My name on a poster. My dad says get a real job — but this IS real."},{who:"npc",text:"Rules? Curfews? That's my dad's language. But if YOU ask me nicely, I'll listen. You're my G."},{who:"narrator",text:"Tobi cares about FUN and RESPECT (clout). He follows people he trusts, not rules."}]),{id:"chat_tobi",npc:"tobi",label:"Ask about his music",kind:"chat",daily:!0,cond:V("tobi"),lines:e=>{const t=We(Pe(e.seed,e.day,31),Sn);return[{who:"npc",text:t.text,plain:t.plain}]},effects:{trust:{tobi:2},happiness:3}},{id:"tobi_nepa",npc:"tobi",label:"Remind him about the NEPA bill",kind:"mission",cond:e=>V("tobi")(e)&&Pt("tobi")(e)&&!f(e,"tobi_will_pay_nepa")&&!f(e,"tobi_deal"),lines:[{who:"npc",text:"NEPA bill? Ehn... I go pay. Soon. Very soon. After my next gig.",plain:"I'll pay... eventually."}],choices:[{label:'"Tobi. Please. For me."',blocked:e=>e.trust.tobi<55?"Tobi needs to trust you more (55+)":null,effects:{flags:["tobi_will_pay_nepa"],trust:{tobi:1}},reply:[{who:"npc",text:`Ah, you used the "for me" card. Okay okay. I'll pay before the deadline. Promise.`}]},{label:"Pay his ₦2,000 share for him",blocked:e=>e.stats.cash<2e3?"Not enough cash":null,effects:{run:e=>{ye(e,"nepa","tobi")}},reply:[{who:"npc",text:"You paid for me?! Bestie behaviour! Next song is dedicated to you."}]},{label:`"Okay. Don't forget."`,reply:[{who:"npc",text:"Me? Forget? Never. (He has already forgotten.)"}]}]},{id:"laundry_tobi",npc:"tobi",label:"Is that MY shirt in your video?",kind:"mission",once:!0,cond:e=>e.missions.m_laundry==="active"&&f(e,"clue_kemi"),lines:[{who:"npc",text:"...Okay so, hear me out. The shirt has GOLD BUTTONS. The lighting was perfect. It was destiny."},{who:"npc",text:"The video has 3,000 views. Technically, your shirt is famous now."}],choices:[{label:'Laugh: "At least tag me next time!"',effects:{trust:{tobi:8},happiness:6,flags:["shirt_back","laundry_kind"]},reply:[{who:"npc",text:"TAG? I'll make you a co-star! Here's your shirt — freshly washed, I promise."}]},{label:"Demand it back, sternly",effects:{trust:{tobi:-6},reputation:2,flags:["shirt_back","laundry_stern"]},reply:[{who:"npc",text:"Sorry, sorry! Here. I just... wanted to look nice for the people."}]},{label:`"That's ₦1,000 rental fee, superstar."`,effects:{cash:1e3,trust:{tobi:-1},happiness:3,flags:["shirt_back","laundry_fee"]},reply:[{who:"npc",text:"Business-minded! Okay, okay, here's ₦1,000. Iya Bisi would be proud."}]}]},{id:"tobi_headphones",npc:"tobi",label:"Ask him to use headphones at night",kind:"mission",once:!0,cond:e=>e.missions.m_amaka==="active"&&f(e,"amaka_asked")&&!f(e,"tobi_headphones"),lines:[{who:"npc",text:"Headphones? At night? But then how will the compound enjoy my art?"}],choices:[{label:'"Amaka saves lives. Let her sleep. Do it for me."',blocked:e=>e.trust.tobi<55?"Tobi needs to trust you more (55+)":null,effects:{flags:["tobi_headphones"],trust:{tobi:2}},reply:[{who:"npc",text:"When you put it like that... fine. Headphones after 10. For Nurse Amaka. And for you."}]},{label:"Buy him proper headphones (₦3,000)",blocked:e=>e.stats.cash<3e3?"Not enough cash":null,effects:{cash:-3e3,flags:["tobi_headphones"],trust:{tobi:6}},reply:[{who:"npc",text:"Studio headphones?! Bass boost?! Deal! The compound will hear nothing!"}]},{label:'"Do it, or Chief will hear about it."',effects:{flags:["tobi_headphones"],trust:{tobi:-8}},reply:[{who:"npc",text:"Wow. Okay. Didn't know we were enemies. Fine."}]}]},{id:"tobi_skit",npc:"tobi",label:"Help film his skit (2h)",kind:"mission",once:!0,time:2,cond:e=>e.missions.m_skit==="active",lines:[{who:"npc",text:'Skit title: "When NEPA Brings Light For Two Seconds". You play the neighbour who screams UP NEPA. Action!'},{who:"narrator",text:"Seven takes. Iya Bisi photobombs twice. Aunty Kemi gives notes nobody asked for. It is perfect."}],effects:{flags:["skit_filmed"],trust:{tobi:10},happiness:10}}];function hi(e){return qi.find(t=>t.id===e)}function Pn(e,t){return qi.filter(i=>i.npc!==t||i.kind!=="intro"&&!f(e,"met_"+t)||i.once&&f(e,"topic_"+i.id)||i.daily&&f(e,`topic_${i.id}_d${e.day}`)?!1:i.cond?i.cond(e):!0)}function Mn(e,t){t.once&&_(e,"topic_"+t.id),t.daily&&_(e,`topic_${t.id}_d${e.day}`)}function ci(e,t){return typeof t=="function"?t(e):t}const In=[{id:"arrival",title:"Welcome to Unity Compound",icon:"home",lines:e=>[{who:"narrator",text:`7:00am. ${e.playerName} drags a Ghana-must-go bag through the blue gate of Unity Compound, 7 Adebayo Close.`,plain:"Ghana-must-go = a big checkered travel bag."},{who:"narrator",text:"Six flats. One generator. One water tank. Endless opinions."},{who:"kemi",text:"Ehen! New tenant! Welcome o! Room 4, abi? The last person there left in the middle of the night. Long story. I will tell you.",plain:"Room 4, right?"}],choices:[{label:'"Thank you, ma! Happy to be here."',effects:{trust:{kemi:3},happiness:3},result:"Aunty Kemi beams. You have made your first ally — and possibly your first informant."},{label:'"...Why did they leave at night?"',effects:{happiness:-1,flags:["curious_room4"]},result:'Aunty Kemi just smiles mysteriously. "Later. Unpack first."'}]},{id:"nepa_cut",title:"NEPA Don Take Light!",icon:"power",lines:[{who:"narrator",text:"The fan dies mid-spin. Every TV in the compound goes black at once. From somewhere: a collective groan.",plain:'NEPA = the power company. "Take light" = power cut.'},{who:"tobi",text:"NOOOO! My phone was at 4%!"},{who:"bisi",text:"My fish! My freezer! Who has fuel?!"}],choices:[{label:"Check the generator",effects:{flags:["hint_gen"]},result:"The shared generator is by the right wall. Its tank is empty. Iya Bisi sells fuel at the kiosk by the gate."},{label:"Shrug — it will come back",effects:{happiness:-2},result:"You sit in the heat and wait. Somewhere, a goat bleats sympathetically."}]},{id:"bill_notice",title:"The NEPA Bill Has Landed",icon:"bill",onFire:e=>{ut(e,"nepa","NEPA electricity bill",2e3,3)},lines:[{who:"narrator",text:"A NEPA official slides a bill under the gate and leaves very fast, like a man who has met tenants before."},{who:"chief",text:"₦12,000 for the compound. ₦2,000 per flat. Due by the end of Day 3, or they cut our wire. I am exempt — I am the landlord."},{who:"femi",text:"Exempt? Can I also be exempt? I am a stakeholder."}],choices:[{label:"Pay your ₦2,000 share now",blocked:e=>e.stats.cash<2e3?"Not enough cash":null,effects:{run:e=>{ye(e,"nepa","you")}},result:"Paid. Chief writes your name in his little green book with approval."},{label:"Pay later (check the meter or Bills)",result:"Bills live at the electricity meter on the wall and in the Bills tab. Everyone must pay before Day 3 ends."}]},{id:"laundry_missing",title:"Who Carry My Shirt?",icon:"laundry",lines:[{who:"narrator",text:"You go to the laundry line. Your favourite red shirt with the gold buttons is gone. Only the peg remains, swinging like a crime scene."}],choices:[{label:"Investigate (new mission)",effects:{flags:["laundry_case"]},result:"Mission added: find your shirt. Start by inspecting the laundry line."},{label:'Shout "WHO CARRY MY SHIRT?!"',effects:{flags:["laundry_case"],happiness:2,trust:{amaka:-2},reputation:-1},result:"The whole compound hears you. Amaka, trying to sleep, does not appreciate it. Mission added."}]},{id:"noisy_music",title:"Speaker Wahala",icon:"music",cond:e=>!f(e,"quiet_hours")&&!f(e,"tobi_headphones"),lines:[{who:"narrator",text:`9pm. Tobi's speaker launches "Owambe Mix Vol. 47". The windows vibrate. A lizard on the wall starts nodding.`,plain:"Owambe = a big Nigerian party."},{who:"amaka",text:"(from Room 1) I HAVE A SHIFT AT ELEVEN!"}],choices:[{label:"Join the dance!",effects:{happiness:8,trust:{tobi:5,amaka:-4}},result:"You show moves nobody expected. Tobi records it. Amaka records a mental note."},{label:"Ask Tobi to turn it down",effects:{trust:{tobi:-2,amaka:5},reputation:1},result:'Tobi lowers it to "only the neighbours can hear". Amaka mouths "thank you" through the window.'},{label:"Report it to Chief",effects:{trust:{tobi:-6,chief:3,amaka:2},reputation:1},result:"Chief storms down in his slippers. Silence falls. Tobi looks betrayed."}]},{id:"expense_dispute",title:"Freezer vs. Fuel",icon:"dispute",lines:[{who:"kemi",text:"Iya Bisi's freezer is the one drinking all the generator fuel! It's not fair on the rest of us!"},{who:"bisi",text:"And your hair dryer? Is it powered by prayer? Abeg!"},{who:"narrator",text:"They both turn to you. Apparently you are now a judge."}],choices:[{label:"Side with Aunty Kemi",effects:{trust:{kemi:6,bisi:-6}},result:"Kemi raises your hand like a boxing champion. Iya Bisi charges you double for your next noodles (in spirit)."},{label:"Side with Iya Bisi",effects:{trust:{bisi:6,kemi:-6}},result:"Iya Bisi slips you a free sachet of water. Aunty Kemi begins composing gossip about you."},{label:"Propose paying by usage — big users pay more",effects:{trust:{bisi:2,kemi:2,amaka:3},reputation:4},result:"Grumbling, they both agree it is fair. Nurse Amaka nods approvingly from across the courtyard."}]},{id:"visitor",title:"Cousin From the Village",icon:"visitor",onFire:e=>{_(e,"visitor_here
